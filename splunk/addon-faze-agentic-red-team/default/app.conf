# App.conf for FAZE Agentic Red Team Add-on
# Splunk 9.4.7+ compatible add-on manifest

[install]
# Version of this add-on
version = 1.0.0
# Requires
build = 1

[ui]
version = 11.0
is_visible = true
is_manageable = true
label = FAZE Agentic Red Team Add-on

[launcher]
version = 1.0
description = Fetches vulnerability data from FAZE Security Agentic Red Team platform
author = FAZE Security Integration

[package]
version = 1.0.0
check_for_updates = false

[views]
# Link to views if you create them
# faze_dashboard = FAZE Agentic Red Team Dashboard

[shcluster_scheme]
# For Splunk Cloud deployments
# enabled = true

[capability]
# Add capabilities as needed for the add-on
