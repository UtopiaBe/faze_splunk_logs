# Props.conf for FAZE Agentic Red Team Add-on
# Field extraction and transformation rules for Splunk 9.4.7+

[faze:agentic_red_team]
SHOULD_LINEMERGE = false
TRUNCATE = 100000
LINE_BREAKER = ([\r\n]+)

# Timestamp configuration
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%f%z
MAX_TIMESTAMP_LOOKAHEAD = 50

# JSON parsing
KV_MODE = json
INDEXED_EXTRACTIONS = json

# Alias fields for easier search
FIELDALIAS-severity_as_level = severity AS severity_level

# Event type
EVAL-event_type = "vulnerability"
EVAL-source_system = "faze_agentic_red_team"

# Severity-based priority
EVAL-priority = case(
  severity=="Critical", 1,
  severity=="High", 2,
  severity=="Medium", 3,
  severity=="Low", 4,
  severity=="Informative", 5,
  1=1, 10
)

# Risk scoring (based on severity)
EVAL-risk_score = case(
  severity=="Critical", 100,
  severity=="High", 80,
  severity=="Medium", 60,
  severity=="Low", 40,
  severity=="Informative", 20,
  1=1, 0
)

# Category for CIM
EVAL-category = "Vulnerability Detection"

# Nullqueue for errors (optional)
# TRANSFORMS-route = route_errors

# Field acceleration (for reports)
ACCELERATE_PHYS_SEARCHES = true
RAPID_DIAGNOSIS_HIGHEST_RANK = 5

# CIM compliant field mappings
EVAL-vendor = "FAZE Security"
EVAL-product = "Agentic Red Team"
EVAL-dvc = asset_name
EVAL-name = vulnerability_name
EVAL-severity_id = priority

# Search-time extractions (if needed)
# TRANSFORMS-extract = extract_json_fields

# Lookups (optional - add if you create lookup tables)
# LOOKUP-asset_lookup = asset_lookup asset_id OUTPUT asset_details

# Summary indexing (for acceleration)
SUMMARY_2 = Event Search

# Tagging
TAG-eventtype = vulnerability
TAG-category = Security Detection
TAG-application = vulnerability_management

# Custom meta
# METADATA = default
