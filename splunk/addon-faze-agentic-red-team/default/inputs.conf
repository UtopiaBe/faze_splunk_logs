# Inputs.conf for FAZE Agentic Red Team Add-on
# Splunk 9.4.7+ compatible input configuration

[faze_agentic_red_team://FAZE_ART]
description = Fetch vulnerabilities from FAZE Agentic Red Team API
index = security
sourcetype = faze:agentic_red_team
source = faze:agentic_red_team
host = $decideOnStartup

# Scheduling (runs every 6 hours)
interval = 21600
disabled = false

# Script execution
python.version = python3
script = fetch_agentic_red_team.py

# Connection timeout
connection_timeout = 30
read_timeout = 30

# Output queue
output_group = default

# Event processing
event_breaker_enable = true
line_breaker = ([\r\n]+)

# Character encoding
charset = UTF-8

# Restart handler
restart_timeout = 60
restart_on_error = true

# Log level (debug/info/warn/error)
log_level = info

# Error handling
error_index = _internal
error_key_indicator = ERROR

# Sourcetype validation
should_linemerge = false
max_event_size = 100000

# Optional: Add HTTP proxy if needed
# http_proxy_url = http://proxy.example.com:8080
# http_proxy_username = username
# http_proxy_password = password

# Optional: SSL/TLS configuration
# sslConfig = faze_ssl_config
# sslVerifyServerCert = true

# Optional: Custom attributes
# host_prefix = FAZE_
# index_discovery = enabled

# Performance tuning
# max_threads = 1
# queue_size = 10MB

# Handling intervals
# can_be_enabled = true
# can_be_disabled = false
