# Field extractions for vulnerability data
[vulnerability_sourcetype]
TRANSFORMS-add_fields = add_vuln_sourcetype

[add_vuln_sourcetype]
REGEX = ^(.*)$
FORMAT = vulnerability::$1
DEST_KEY = MetaData:Sourcetype

# Vulnerability type categorization
[vuln_type_lookup]
filename = vulnerability_types.csv
match_type = WILDCARD(vulnerability_type)

# Severity level categorization
[severity_lookup]
filename = severity_levels.csv
match_type = WILDCARD(severity)

# CTA (Correlation with Technical Analysis)
[eventtype_cta]
search = eventtype=vulnerability_detection severity=critical OR severity=high

# ESCU (Enterprise Security Content Update) compatible extractions
[escu_vulnerability]
REGEX = "vulnerability_type":\s*"([^"]+)"
FORMAT = vulnerability_type::$1
DEST_KEY = _MetaData:Sourcetype
