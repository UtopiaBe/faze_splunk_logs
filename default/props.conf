# Agentic Red Team Add-on Field Properties

[agentic:red_team:vulnerability]
SHOULD_LINEMERGE = false
TIMESTAMP_FIELDS = timestamp, detection_timestamp
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%f
MAX_TIMESTAMP_LOOKAHEAD = 30
LINE_BREAKER = \}(?=\n\{)
TRUNCATE = 100000

# Automatic field extraction (Auto KV)
AUTO_KV_JSON = true
EXTRACT-json = (?<json_data>.*)

# Manually extracted fields
EXTRACT-event_type = "event_type":\s*"(?<event_type>[^"]+)"
EXTRACT-vuln_type = "vulnerability_type":\s*"(?<vulnerability_type>[^"]+)"
EXTRACT-severity = "severity":\s*"(?<severity>[^"]+)"
EXTRACT-target = "target":\s*"(?<target>[^"]+)"
EXTRACT-session_id = "session_id":\s*"(?<session_id>[^"]+)"
EXTRACT-hostname = "hostname":\s*"(?<hostname>[^"]+)"
EXTRACT-source = "source":\s*"(?<source>[^"]+)"
EXTRACT-cve_ids = "cve_ids":\s*\[([^\]]+)\]
EXTRACT-component = "affected_component":\s*"(?<affected_component>[^"]+)"
EXTRACT-remediation = "remediation":\s*"(?<remediation>[^"]+)"
EXTRACT-priority = "remediation_priority":\s*(?<remediation_priority>\d+)

# Aliases for common field names
FIELDALIAS-src_ip = target AS src_ip
FIELDALIAS-dest_ip = target AS dest_ip
FIELDALIAS-service = affected_component AS service
FIELDALIAS-msg = description AS msg
FIELDALIAS-action = event_type AS action

# Lookup configurations
LOOKUP-severity_level = severity_lookup severity OUTPUT severity_level

# Calculated fields
EVAL-risk_score = case(
    severity="critical", 100,
    severity="high", 80,
    severity="medium", 60,
    severity="low", 40,
    severity="info", 20
)

EVAL-needs_immediate_action = if(severity="critical" OR severity="high", "true", "false")
EVAL-has_cve = if(like(cve_ids, "%CVE%"), "true", "false")

# Report settings
REPORT-extract_json = extract_json
REPORT-extract_fields = extract_event_type, extract_severity, extract_target

# Category
CATEGORY-Threat_Detection = true

# Workload Discovery
[agentic:red_team:vulnerability]
WD_FIELDNAME = affected_component
WD_FIELDVALUE = service

# Data model mapping
EVAL-src = if(like(target, "%:%"), substr(target, 1, round(len(target) - round(len(target) - len(rtrim(target, "0123456789", len(target) - 1))) - 1)), target)
